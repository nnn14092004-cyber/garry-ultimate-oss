name: Garry The Ultimate OSS Deterministic CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-deterministic-kernel:
    name: Verify O(1) Omniverse & Navier-Stokes Kernel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Gate 1 - Verify Zero External Dependencies
        run: |
          cargo tree --depth 1

      - name: Gate 2 - Zero-Warning Clippy Static Analysis
        run: |
          cargo clippy --all-targets -- -D warnings

      - name: Gate 3 - Execute 23/23 Omniverse & Navier-Stokes Unit & Falsification Tests
        run: |
          cargo test --verbose

      - name: Gate 4 - Bare-Metal O(1) Release Benchmark Smoke Test
        run: |
          cargo run --release -- bench