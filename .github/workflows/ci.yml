name: garry-ultimate-oss Deterministic CI (v4.0.0)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-deterministic-kernel:
    name: Verify Pure-Rust Kernel & BLW CAP Emitter (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Gate 1 - Verify Zero External Dependencies
        run: |
          cargo tree --depth 1

      - name: Gate 2 - Zero-Warning Clippy Static Analysis
        run: |
          cargo clippy --all-targets -- -D warnings

      - name: Gate 3 - Execute 33/33 Rust Unit, BLW CAP & Falsification Tests
        run: |
          cargo test --release --verbose

      - name: Gate 4 - Stack Latency Benchmark Smoke Test
        run: |
          cargo run --release -- bench

      - name: Gate 5 - Emit BLW CAP, Canonical Suites & Autonomous Mode Certificates
        run: |
          cargo run --release -- --certify-blw
          cargo run --release -- solutions
          cargo run --release -- synthesize

      - name: Gate 6 - Static Lean 4 Axiom/Sorry Audit & BLW Artifact Check
        shell: bash
        run: |
          test -f garry_workspace/solutions/blw_r3_report.txt
          test -f garry_workspace/solutions/blw_r3_certificate.smt2
          test -f garry_workspace/solutions/blw_r3_certificate.lean
          PY=""
          for cand in python3 python; do
            if command -v "$cand" >/dev/null 2>&1 && "$cand" -c "import sys" >/dev/null 2>&1; then
              PY="$cand"
              break
            fi
          done
          test -n "$PY" || { echo "ERROR: Python interpreter not found." >&2; exit 1; }
          "$PY" - <<'PY'
          import glob, re, sys

          def strip_lean(src: str) -> str:
              out, i, n, depth, in_str = [], 0, len(src), 0, False
              while i < n:
                  ch = src[i]
                  nxt = src[i + 1] if i + 1 < n else ""
                  if depth > 0:
                      if ch == "/" and nxt == "-":
                          depth += 1; out.append("  "); i += 2
                      elif ch == "-" and nxt == "/":
                          depth -= 1; out.append("  "); i += 2
                      else:
                          out.append("\n" if ch == "\n" else " "); i += 1
                  elif in_str:
                      if ch == "\\" and i + 1 < n:
                          out.append("  "); i += 2
                      elif ch == '"':
                          in_str = False; out.append(" "); i += 1
                      else:
                          out.append("\n" if ch == "\n" else " "); i += 1
                  else:
                      if ch == "/" and nxt == "-":
                          depth = 1; out.append("  "); i += 2
                      elif ch == "-" and nxt == "-":
                          while i < n and src[i] != "\n":
                              out.append(" "); i += 1
                      elif ch == '"':
                          in_str = True; out.append(" "); i += 1
                      else:
                          out.append(ch); i += 1
              return "".join(out)

          pat = re.compile(r"(^\s*(?:private\s+|protected\s+)?axiom\b|\b(?:sorry|sorryAx|admit)\b)")
          hits = []
          for g in ("formal_proofs_mathlib/*.lean", "garry_workspace/solutions/*.lean"):
              for path in sorted(glob.glob(g)):
                  raw = open(path, encoding="utf-8").read()
                  clean = strip_lean(raw)
                  raw_lines = raw.splitlines()
                  for idx, line in enumerate(clean.splitlines(), 1):
                      if pat.search(line):
                          hits.append(f"{path}:{idx}: {raw_lines[idx - 1]}")
          if hits:
              print("\n".join(hits), file=sys.stderr)
              sys.exit(1)
          print("Static Lean 4 audit clean: 0 executable sorry/sorryAx/admit/custom axiom declarations.")
          PY
