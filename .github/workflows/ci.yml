name: Garry The Ultimate OSS Deterministic CI/CD (v4.0.0)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify-deterministic-kernel:
    name: Verify O(1) Rust Kernel & Autonomous Synthesizer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Gate 1 - Verify Zero External Dependencies
        run: |
          cargo tree --depth 1

      - name: Gate 2 - Zero-Warning Clippy Static Analysis
        run: |
          cargo clippy --all-targets -- -D warnings

      - name: Gate 3 - Execute 30/30 Omniverse, Autonomous v4 & Falsification Tests
        run: |
          cargo test --release --verbose

      - name: Gate 4 - Bare-Metal O(1) Release Benchmark Smoke Test
        run: |
          cargo run --release -- bench

      - name: Gate 5 - Verify Canonical Suites (ns_1..ns_5) & Autonomous u0 Synthesizer
        run: |
          cargo run --release -- solutions
          cargo run --release -- synthesize